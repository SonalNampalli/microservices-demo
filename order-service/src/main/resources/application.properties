spring.application.name=order-service
server.port=8082

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/orderdb}
spring.datasource.username=${DB_USERNAME:sonal}
spring.datasource.password=${DB_PASSWORD:LOCAL_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

user-service.url=${USER_SERVICE_URL:http://localhost:8081}


